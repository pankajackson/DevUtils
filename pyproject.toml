[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lxa-utils"
version = "0.0.1"
authors = [
    { name = "Pankaj Jackson", email = "pankajackson@live.co.uk" }
]
description = "QtileLXA is a collection of small, handy scripts and utilities for everyday use and automation, making life simpler and more efficient."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]

requires-python = ">=3.10"

dependencies = [
    "pydantic==2.13.5",
    "PyYAML==6.0.3"
]

keywords = [
    "utilities",
    "server",
    "desktop",
    "linux",
    "arch"
]

classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/pankajackson/DevUtils"
"Bug Tracker" = "https://github.com/pankajackson/DevUtils/issues"
Source = "https://github.com/pankajackson/DevUtils"
